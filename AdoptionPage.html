<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adoption Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <Main>
        <h1> Adoption Application </h1>
    <form>
        <section>
            <h2>Your Details</h2>

            <div>
            <label>Full name: </label>
            <input type="text">
            <br><br>
            </div>
        
            <div>
            <label>Email: </label>
            <input type="email">
            <br><br>
            </div>

            <div>
            <label>Phone: </label>
            <input type="tel">
            <br><br>
            </div>

            <div>
            <label>ID Number: </label>
            <input type="text">
            <br><br>
            </div>

        </section> 

        <section>
            <h2>Your Home and lifestyle</h2>

            <div>
            <label>Address: </label>
            <input type="text">
            <br><br>
            </div>

            <div>
            <label>City: </label>
            <input type="text">
            <br><br>
            </div>
            
            <label>Home Type:</label>
            <select>
                <option>House</option>
                <option>Apartment</option>
                <option>Townhouse</option>
                <option>Other</option>
            </select>
            <br><br>

            <p>Do you currently have pets?</p>
            <input type="radio">
            <label>Yes</label>

            <input type="radio">
            <label>No</label>
        </section>

        <section>
            <h2>More Information</h2>
            <label>Why do you want to adopt an animal</label>  <br>
            <textarea></textarea>
        </section>

    

    <a href="progress.html">
    <button>Next</button>
</a>

    </form>

    </Main>


    
</body>
</html>
